---
- name: Setup VPS with Docker and Mailu
  hosts: vps
  become: yes

  vars:
    mailu_dirs:
      - redis
      - certs
      - data
      - dkim
      - mail
      - mailqueue
      - filter
      - overrides

  tasks:
    - name: Update and upgrade apt packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install required system packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker’s official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release | lower }} stable"
        state: present
        filename: docker

    - name: Install Docker engine and plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Ensure Mailu base directory exists
      file:
        path: /mailu
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Ensure Mailu data subdirectories exist
      file:
        path: "/mailu/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ mailu_dirs }}"

    - name: Copy Mailu docker-compose.yml
      copy:
        src: ./mailu/docker-compose.yml
        dest: /opt/mailu/docker-compose.yml
        owner: root
        group: root
        mode: '0644'

    - name: Copy Mailu environment file
      copy:
        src: ./mailu/mailu.env
        dest: /opt/mailu/mailu.env
        owner: root
        group: root
        mode: '0600'

    - name: Ensure Mailu stack is up
      community.docker.docker_compose:
        project_src: /opt/mailu
        state: present
